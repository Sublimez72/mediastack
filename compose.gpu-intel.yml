# Hardware transcoding on Intel Quick Sync / AMD VAAPI for every media server
# that's switched on (Linux hosts). Plex needs Plex Pass, Emby needs Emby
# Premiere; Jellyfin is free.
x-dri: &dri
  devices:
    - /dev/dri:/dev/dri

services:
  plex: *dri
  jellyfin: *dri
  emby: *dri
  stack-init:
    environment:
      GPU: intel                   # stack-init switches on Jellyfin's VAAPI transcoding
