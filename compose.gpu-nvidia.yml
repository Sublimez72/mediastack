# Hardware transcoding on NVIDIA for every media server that's switched on
# (needs NVIDIA Container Toolkit; on Windows, Docker Desktop's WSL2 backend
# provides it). Plex needs Plex Pass, Emby needs Emby Premiere; Jellyfin is free.
x-nvidia: &nvidia
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, video, compute, utility]

services:
  plex: *nvidia
  jellyfin: *nvidia
  emby: *nvidia
  stack-init:
    environment:
      GPU: nvidia                  # stack-init switches on Jellyfin's NVENC transcoding
